name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (next for testing; latest for a reviewed release)"
        type: choice
        options: [next, latest]
        default: next

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - run: npm test

      - run: npm pack --dry-run

      - run: npm publish --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.tag }}
